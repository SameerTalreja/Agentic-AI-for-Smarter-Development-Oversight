services:
  - type: web
    name: agentic-infra-analyst-backend
    env: python
    buildCommand: "pip install -r requirements.txt && python db/seed.py"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: MAX_AGENT_STEPS
        value: "8"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"